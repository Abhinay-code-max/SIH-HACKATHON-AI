<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Offline Surveillance Map — Local Prototype</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #0F172A;
            color: #F8FAFC;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .badge-offline {
            background-color: #059669;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .map-container {
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }
        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #090D16;
        }
        .legend {
            margin-top: 16px;
            display: flex;
            gap: 20px;
            font-size: 13px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h2 style="margin: 0 0 4px 0;">Local Security & Surveillance Grid</h2>
            <div style="font-size: 13px; color: #94A3B8;">Zero-Internet Offline Vector Map Engine | Area: HITEC Demonstration Perimeter</div>
        </div>
        <div class="badge-offline">NETWORK STATUS: 100% OFFLINE / LOCAL</div>
    </div>

    <div class="map-container">
        <svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
            <!-- Grid Background -->
            <defs>
                <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
                    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1E293B" stroke-width="1"/>
                </pattern>
            </defs>
            <rect width="1000" height="800" fill="url(#grid)" />

            <!-- Security Zones -->
            
            <polygon points="162.5,662.5 500.0,662.5 500.0,400.0 162.5,400.0 162.5,662.5" fill="#3B82F6" fill-opacity="0.3" stroke="#3B82F6" stroke-width="2">
                <title>Pedestrian Concourse & Public Plaza</title>
            </polygon>
            
            <polygon points="500.0,662.5 837.5,662.5 837.5,400.0 500.0,400.0 500.0,662.5" fill="#F59E0B" fill-opacity="0.3" stroke="#F59E0B" stroke-width="2">
                <title>Gate 1 Access & Vehicle Checkpoint</title>
            </polygon>
            
            <polygon points="162.5,400.0 837.5,400.0 837.5,137.5 162.5,137.5 162.5,400.0" fill="#EF4444" fill-opacity="0.3" stroke="#EF4444" stroke-width="2">
                <title>Critical Infrastructure & Command Perimeter</title>
            </polygon>
            

            <!-- Road Corridors -->
            
            <polyline points="50.0,531.2 950.0,531.2" stroke="#475569" stroke-width="6" stroke-linecap="round" fill="none" />
            <polyline points="50.0,531.2 950.0,531.2" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8,6" fill="none" />
            
            <polyline points="500.0,750.0 500.0,50.0" stroke="#475569" stroke-width="6" stroke-linecap="round" fill="none" />
            <polyline points="500.0,750.0 500.0,50.0" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8,6" fill="none" />
            

            <!-- Camera Points -->
            
            <g transform="translate(331.2, 531.2)">
                <circle r="12" fill="#1E293B" stroke="#38BDF8" stroke-width="3" />
                <circle r="4" fill="#38BDF8" />
                <text x="16" y="5" font-family="monospace" font-size="12" fill="#E2E8F0" font-weight="bold">CAM_01 (ONLINE)</text>
            </g>
            
            <g transform="translate(668.7, 531.2)">
                <circle r="12" fill="#1E293B" stroke="#38BDF8" stroke-width="3" />
                <circle r="4" fill="#38BDF8" />
                <text x="16" y="5" font-family="monospace" font-size="12" fill="#E2E8F0" font-weight="bold">CAM_02 (ONLINE)</text>
            </g>
            
            <g transform="translate(500.0, 268.8)">
                <circle r="12" fill="#1E293B" stroke="#38BDF8" stroke-width="3" />
                <circle r="4" fill="#38BDF8" />
                <text x="16" y="5" font-family="monospace" font-size="12" fill="#E2E8F0" font-weight="bold">CAM_03 (ONLINE)</text>
            </g>
            

            <!-- Live Event Alerts -->
            
            <g transform="translate(12728.7, 5650.0)">
                <circle r="18" fill="#F59E0B" fill-opacity="0.3">
                    <animate attributeName="r" values="12;24;12" dur="2s" repeatCount="indefinite"/>
                    <animate attributeName="fill-opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
                </circle>
                <circle r="8" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
                <text x="14" y="-12" font-family="monospace" font-size="11" fill="#F59E0B" font-weight="bold">[MEDIUM] crowd_density (person_group)</text>
            </g>
            
            <g transform="translate(12728.7, 5650.0)">
                <circle r="18" fill="#EF4444" fill-opacity="0.3">
                    <animate attributeName="r" values="12;24;12" dur="2s" repeatCount="indefinite"/>
                    <animate attributeName="fill-opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
                </circle>
                <circle r="8" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
                <text x="14" y="-12" font-family="monospace" font-size="11" fill="#EF4444" font-weight="bold">[CRITICAL] unauthorized_vehicle (bus)</text>
            </g>
            
            <g transform="translate(12728.7, 5650.0)">
                <circle r="18" fill="#10B981" fill-opacity="0.3">
                    <animate attributeName="r" values="12;24;12" dur="2s" repeatCount="indefinite"/>
                    <animate attributeName="fill-opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
                </circle>
                <circle r="8" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
                <text x="14" y="-12" font-family="monospace" font-size="11" fill="#10B981" font-weight="bold">[LOW] object_detected (person)</text>
            </g>
            
        </svg>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="legend-color" style="background:#3B82F6;"></div> Pedestrian Concourse</div>
        <div class="legend-item"><div class="legend-color" style="background:#F59E0B;"></div> Vehicle Checkpoint</div>
        <div class="legend-item"><div class="legend-color" style="background:#EF4444;"></div> Critical Command Perimeter</div>
        <div class="legend-item"><div class="legend-color" style="background:#38BDF8; border-radius: 50%;"></div> Cameras (CAM_01..03)</div>
        <div class="legend-item"><div class="legend-color" style="background:#EF4444; border-radius: 50%;"></div> Critical Alert</div>
    </div>
</body>
</html>
